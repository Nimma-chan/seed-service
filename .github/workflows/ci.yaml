name: CI

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5   #скрипты на стороне гита
      #- run                         #скрипты на нашей стороне
      - name: Установить uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: установить зависимости
        run: uv sync
      - name: проверка линтера
        run: uv run ruff check .
      - name: запуск тестов
        run: uv run pythest
        env:
          GREETING: "ci"
          DATABASE_URL: "postgresql://ci:ci@db:5432/ci"


  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: настроить сборщик для докера
        uses: docker/setup-buildx-action@v4
      - name: вход в реестр  GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.sctor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

